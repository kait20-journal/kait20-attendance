.dta{display:flex;gap:6px;flex:none}.dtb{border:1px solid var(--line);background:rgba(var(--w),.08);color:inherit;border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600;cursor:pointer;min-width:38px}
.dtb.on{background:var(--t-ok);border-color:var(--t-ok);color:#0b1f12}.dtb.on2{background:var(--t-warn);border-color:var(--t-warn);color:#2a1c04}html[data-theme=light] .dtb.on{color:#fff}

<script>
(function () {
  var K = KAIT, S = K.Store, UI = window.UI, $ = UI.$, esc = K.esc, PIN = '2026';

  /* ---------- вход ---------- */
  function enter() { $('#gate').hidden = true; $('#shell').hidden = false; init(); }
  function tryPin() {
    var v = $('#pin').value;
    if (K.REMOTE) {
      $('#pinErr').textContent = 'Проверяю…';
      K.Net.login({ pin: v }).then(function () { try { sessionStorage.setItem('kait20-admin-pin', v); } catch (e) {} enter(); }).catch(function (e) { $('#pinErr').textContent = e.message === 'auth' ? 'Неверный PIN' : 'Нет связи с сервером'; $('#pin').value = ''; });
      return;
    }
    if (v === PIN) { try { sessionStorage.setItem('kait20-admin', '1'); } catch (e) {} enter(); } else { $('#pinErr').textContent = 'Неверный PIN'; $('#pin').value = ''; } }
  $('#pinOk').onclick = tryPin; $('#pin').onkeydown = function (e) { if (e.key === 'Enter') tryPin(); };
  var ok = false, sp = '';
  if (K.REMOTE) { try { sp = sessionStorage.getItem('kait20-admin-pin') || ''; } catch (e) {} $('#gate .xs').hidden = true; $('#pin').maxLength = 40; $('#pin').inputMode = 'text'; }
  else { try { ok = sessionStorage.getItem('kait20-admin') === '1'; } catch (e) {} }
  if (K.REMOTE && sp) { K.Net.login({ pin: sp }).then(enter).catch(function () { setTimeout(function () { $('#pin').focus(); }, 50); }); }
  else if (ok) setTimeout(enter, 0); else setTimeout(function () { $('#pin').focus(); }, 50);

  /* ---------- состояние ---------- */
  var TM = K.today().slice(0, 7), TEND = K.iso(new Date(+TM.slice(0, 4), +TM.slice(5), 0));
  var st = { rg: '', tab: 'dash', from: '2026-10-01', to: TEND > '2026-11-30' ? TEND : '2026-11-30', course: 0, cs: [], spec: '', gid: '', cur: '', allMiss: false, missCollapsed: true, day: null, thr: 5, allRank: false, allRisk: false, calYm: TM < '2026-10' ? '2026-11' : TM };
  var app;

  function lastWork(d) { var x = K.parse(d); for (var i = 0; i < 10 && S.isOff(K.iso(x)); i++) x.setDate(x.getDate() - 1); return K.iso(x); }
  function pct(v, d) { return v === null || v === undefined ? '–' : v.toFixed(d === undefined ? 1 : d).replace('.', ',') + '%'; }
  function fgroups() {
    return S.groups().filter(function (g) { return (!st.cs.length || st.cs.indexOf(g.course) >= 0) && (!st.spec || g.spec === st.spec) && (!st.gid || g.id === st.gid) && (!st.cur || g.curator === st.cur); });
  }
  function prevWork(d) { var x = K.parse(d); for (var i = 0; i < 14; i++) { x.setDate(x.getDate() - 1); if (!S.isOff(K.iso(x))) break; } return K.iso(x); }
  function weekRange() { var d = K.parse(lastWork(K.today())), a = new Date(d); a.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [K.iso(a), K.iso(d)]; }
  function perOn(p) {
    var td = lastWork(K.today());
    if (p === 't') return st.from === td && st.to === td;
    if (p === 'y') { var y = prevWork(td); return st.from === y && st.to === y; }
    if (p === 'w') { var w = weekRange(); return st.from === w[0] && st.to === w[1]; }
    if (p === 'all') return st.from === '2026-10-01' && st.to === '2026-11-30';
    return st.from === p + '-01' && st.to === K.iso(new Date(+p.slice(0, 4), +p.slice(5), 0));
  }
  function monthsIn(a, b) { var out = [], d = K.parse(a); d = new Date(d.getFullYear(), d.getMonth(), 1); var e = K.parse(b); while (d <= e) { out.push(d.getFullYear() + '-' + K.pad(d.getMonth() + 1)); d.setMonth(d.getMonth() + 1); } return out.slice(0, 6); }
  function monthHead(dates) {
    var out = [], cur = null;
    dates.forEach(function (d) { var m = d.slice(0, 7); if (cur && cur.m === m) cur.n++; else { cur = { m: m, n: 1 }; out.push(cur); } });
    return out.map(function (x) { return '<th colspan="' + x.n + '" style="text-align:left;padding-left:4px;color:#475467">' + K.MONTHS[+x.m.slice(5) - 1] + '</th>'; }).join('');
  }
  function dayCounts(gs, d) {
    var c = { total: 0, here: 0, late: 0, absent: 0, skip: 0, none: 0 };
    gs.forEach(function (g) { S.rosterOn(g, d).forEach(function (s) {
      c.total++; var v = S.get(g.id, s.id, d);
      if (!v) c.none++; else if (v === '+') c.here++; else if (v === 'о') { c.here++; c.late++; } else if (v === 'и' || v === 'р') c.skip++; else c.absent++;
    }); });
    return c;
  }
  function inCollege(gs, dates) {
    var dd = st.day || lastWork(K.today()), off = S.isOff(dd), c = dayCounts(gs, dd), M = c.total || 1;
    function seg(n, col, lab) { return n ? '<div title="' + lab + ': ' + n + '" style="width:' + n / M * 100 + '%;background:' + col + '"></div>' : ''; }
    var W = 560, H = 70, n = dates.length, bw = n ? (W - 4) / n : 0, svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;margin-top:10px">';
    dates.forEach(function (d, i) {
      var x = dayCounts(gs, d), h = x.total ? (H - 8) * x.here / x.total : 0, sel = d === dd;
      svg += '<g data-dd="' + d + '" style="cursor:pointer"><title>' + K.fmtLong(d) + ': в колледже ' + x.here + ' из ' + x.total + (x.none ? ' (не отмечено ' + x.none + ')' : '') + '</title><rect x="' + (2 + i * bw) + '" y="0" width="' + Math.max(bw - 1, 1) + '" height="' + H + '" fill="transparent"/><rect x="' + (2 + i * bw + bw * .12) + '" y="' + (H - 4 - h) + '" width="' + Math.max(bw * .76, 1) + '" height="' + h + '" rx="2" fill="' + (sel ? '#2f5bea' : '#b9c6f5') + '"/></g>';
    });
    svg += '</svg>';
    return '<div class="card sec"><h3>В колледже <small>по выбранным группам · значение меняется по дням</small><span style="flex:1"></span>' +
      '<span class="noprint" style="display:inline-flex;gap:6px;align-items:center"><button class="btn ghost sm" id="dprev">‹</button><input type="date" id="dday" value="' + dd + '" style="border:1px solid var(--line);border-radius:10px;padding:6px 8px"><button class="btn ghost sm" id="dnext">›</button><button class="btn ghost sm" id="dtod">Сегодня</button></span></h3>' +
      (off ? '<div class="mut">' + K.fmtLong(dd) + ' — ' + esc(S.dayInfo(dd).label || 'выходной день') + '. Занятий нет.</div>' :
      '<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><div><div style="font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1">' + c.here + '</div><div class="mut sm">из ' + c.total + ' студентов · ' + Math.round(c.here / M * 100) + '%</div><div class="mut xs" style="margin-top:2px">' + K.fmtLong(dd) + '</div></div>' +
      '<div style="flex:1;min-width:260px"><div style="display:flex;height:16px;border-radius:6px;overflow:hidden;background:#eef1f6">' + seg(c.here, '#22a35a', 'В колледже') + seg(c.absent, '#e5483b', 'Отсутствуют') + seg(c.skip, '#98a2b3', 'ИУП / практика') + '</div>' +
      '<div class="xs mut" style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap"><span><span style="color:#22a35a">■</span> в колледже ' + c.here + (c.late ? ' (опоздали ' + c.late + ')' : '') + '</span><span><span style="color:#e5483b">■</span> отсутствуют ' + c.absent + '</span><span><span style="color:#98a2b3">■</span> ИУП / практика ' + c.skip + '</span><span>не отмечено ' + c.none + '</span></div></div></div>' + svg + '<div class="xs mut">Столбцы — число студентов в колледже по дням периода, нажмите на столбец, чтобы выбрать день.</div>') + '</div>';
  }
  function plural(n, a, b, c) { var m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; }
  function agg(gs, dates) { var c = K.emptyCnt(); gs.forEach(function (g) { K.addCnt(c, K.groupCnt(g.id, dates)); }); return c; }

  /* ---------- дашборд ---------- */
  function dash() {
    var gs = fgroups(), dates = K.studyDates(st.from, st.to), tot = agg(gs, dates), dv = K.derive(tot);
    var days = Math.round((K.parse(st.to) - K.parse(st.from)) / 864e5) + 1, pe = K.parse(st.from); pe.setDate(pe.getDate() - 1);
    var ps = K.parse(st.from); ps.setDate(ps.getDate() - days);
    var pdv = K.derive(agg(gs, K.studyDates(K.iso(ps), K.iso(pe)))), delta = pdv.counted ? dv.pct - pdv.pct : null;
    var specs = S.groups().map(function (g) { return g.spec; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    var courses = S.groups().map(function (g) { return g.course; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
    var all = S.groups();

    var h = '', F = '<div class="filters noprint"><label>С<input type="date" id="f1" value="' + st.from + '"></label><label>По<input type="date" id="f2" value="' + st.to + '"></label>' +
      '<div class="chips" style="margin-bottom:2px">' + [['t', 'Сегодня'], ['y', 'Вчера'], ['w', 'Эта неделя'], ['2026-10', 'Октябрь'], ['2026-11', 'Ноябрь'], ['all', 'Всё время']].map(function (c) { return '<button class="chip' + (perOn(c[0]) ? ' on' : '') + '" data-p="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>' +
      '<div class="chips" style="margin-bottom:2px"><span class="mut sm" style="align-self:center">Курс:</span><button class="chip' + (!st.cs.length ? ' on' : '') + '" data-c="0">Все</button>' + courses.map(function (c) { return '<button class="chip' + (st.cs.indexOf(c) >= 0 ? ' on' : '') + '" data-c="' + c + '">' + c + '</button>'; }).join('') + '</div>' +
      '<label>Специальность<select id="fs"><option value="">Все</option>' + specs.map(function (c) { return '<option' + (st.spec === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>' +
      '<label>Куратор<select id="fcu"><option value="">Все</option>' + S.curators().map(function (c) { return '<option value="' + esc(c.name) + '"' + (st.cur === c.name ? ' selected' : '') + '>' + esc(K.shortName(c.name)) + '</option>'; }).join('') + '</select></label>' +
      '<label>Группа<select id="fg"><option value="">Все</option>' + all.map(function (g) { return '<option' + (st.gid === g.id ? ' selected' : '') + '>' + g.id + '</option>'; }).join('') + '</select></label>' +
      '<div style="flex:1"></div>' + monthsIn(st.from, st.to).map(function (m) { return '<button class="btn ghost sm xlm" data-m="' + m + '">⬇ Табель · ' + K.MONTHS[+m.slice(5) - 1] + '</button>'; }).join('') + '<button class="btn ghost sm" id="pr">🖨 Печать / PDF</button></div>';

    /* кто не заполнил: по кураторам */
    function missBlock(list, day) {
      var by = {}, order = [];
      list.forEach(function (x) {
        var k = x.g.curator || '— куратор не указан';
        if (!by[k]) { by[k] = { name: k, gs: [], m: 0, n: 0 }; order.push(k); }
        var n = S.rosterOn(x.g, day).length; by[k].gs.push({ g: x.g, m: x.m, n: n }); by[k].m += x.m; by[k].n += n;
      });
      var rows = order.map(function (k) { return by[k]; }).sort(function (p, q) { return (p.m ? 1 : 0) - (q.m ? 1 : 0) || p.name.localeCompare(q.name, 'ru'); });
      st.missRows = rows; st.missDay = day;
      var none = rows.filter(function (r) { return !r.m; }).length;
      var out = '<div class="sm" style="margin:8px 0 6px"><b>Не заполнили: ' + rows.length + ' ' + (rows.length === 1 ? 'куратор' : 'кураторов') + '</b>' +
        ' <span class="mut">· красным — вообще не приступили (' + none + '), жёлтым — отмечена только часть студентов (' + (rows.length - none) + ')</span>' +
        ' <button class="btn ghost sm noprint" id="missCopy" style="margin-left:8px">📋 Скопировать напоминание</button>' +
        ' <button class="btn ghost sm noprint" id="missToggle">' + (st.missCollapsed ? '▾ Показать список' : '▴ Свернуть') + '</button></div>';

        delete du.done[key]; o.rep = null; save(); UI.toast('Замена поставлена: ' + v);
      };
      $('#dtRepOk').onclick = go; ri.onkeydown = function (e) { if (e.key === 'Enter') go(); };
      $('#dtRepNo').onclick = function () { o.rep = null; duty(); };
      if ($('#dtRepRm')) $('#dtRepRm').onclick = function () { delete du.over[key]; o.rep = null; save(); };
      ri.focus();
    }
  }
  function opsFormHtml(o) {
    if (!o.add) return '';
    return '<div class="opform"><label>ФИО<input id="opFio" placeholder="Фамилия Имя Отчество" autocomplete="off"></label><label>Должность<input id="opPos" placeholder="Преподаватель" autocomplete="off"></label><button class="btn" id="opOk">Добавить</button><button class="btn ghost" id="opNo">Отмена</button></div>';
  }
  function opsFormBind(o) {
    var f = $('#opFio'); if (!f) return;
    function go() {
      var fio = cleanS(f.value), pos = cleanS($('#opPos').value), d = opsLoad(), k;
      if (!fio) { UI.toast('Введите ФИО'); f.focus(); return; }
      k = K.normFio(fio);
      if (d.staff.some(function (s) { return K.normFio(s.fio) === k; })) { UI.toast('Такой сотрудник уже есть в списке'); return; }
      d.staff.push({ id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), fio: fio, pos: pos }); opsSort(d); opsSave(d);
      o.add = false; ops(); UI.toast('Сотрудник добавлен: ' + fio);
    }
    $('#opOk').onclick = go; $('#opNo').onclick = function () { o.add = false; ops(); };
    [f, $('#opPos')].forEach(function (el) { el.onkeydown = function (e) { if (e.key === 'Enter') go(); }; });
    f.focus();
  }

  function render() {
    [].forEach.call(document.querySelectorAll('#tabs button, .rail button'), function (b) { b.classList.toggle('on', b.dataset.t === st.tab); b.style.color = ''; });
    var tb = document.getElementById('tabs'), on = tb && tb.querySelector('button.on'); if (tb && on) { var q = on.getBoundingClientRect(), w = tb.getBoundingClientRect(); tb.scrollLeft += (q.left + q.width / 2) - (w.left + w.width / 2); }
    if (st.tab === 'dash' || st.tab === 'an') dash(); else if (st.tab === 'tk') tasks(); else if (st.tab === 'cal') { cal(); bindRm(); } else if (st.tab === 'ros') roster(); else if (st.tab === 'ops') ops(); else if (st.tab === 'duty') duty(); else log();
  }
  function bindRm() { [].forEach.call(app.querySelectorAll('[data-rm]'), function (b) { b.onclick = function () { S.setDay(b.dataset.rm, null); }; }); }
  function init() {
    app = $('#app'); $('#helpA').onclick = helpAdmin; UI.themeBtn($('#themeBtn')); UI.demoBar($('#demo'), 'Данные: октябрь 2026 (2–4 курсы) и ноябрь 2026 (1 курс), ФИО студентов обезличены. Страница куратора открывается отдельно: <a href="index.html" target="_blank">index.html</a> — отметки оттуда сразу появляются здесь.');
    [].forEach.call(document.querySelectorAll('#tabs button, .rail button'), function (b) { b.onclick = function () { st.tab = b.dataset.t; $('#drawer').classList.remove('on'); render(); window.scrollTo(0, 0); }; });
    S.onChange(function () { var sc = window.scrollY; render(); window.scrollTo(0, sc); });
    render();
  }
})();
</script>
