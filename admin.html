<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>КАИТ-20 · Посещаемость — панель заведующей</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gate" id="gate"><div class="box">
  <div class="logo">К20</div>
  <h2>Панель заведующей</h2>
  <div class="mut sm" style="margin-top:4px">КАИТ-20 · Посещаемость</div>
  <input type="password" id="pin" inputmode="numeric" maxlength="40" placeholder="••••" autocomplete="off">
  <div class="err" id="pinErr"></div>
  <button class="btn" id="pinOk" style="width:100%">Войти</button>
  <div class="xs mut" style="margin-top:12px">Демо-PIN: <b>2026</b></div>
</div></div>

<div id="shell" hidden>
<div class="app">
<nav class="rail" aria-label="Разделы">
  <button data-t="dash" class="on" title="Дашборд" aria-label="Дашборд"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <button data-t="cal" title="Календарь дней" aria-label="Календарь дней"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></button>
  <button data-t="an" title="Аналитика" aria-label="Аналитика"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
  <button data-t="tk" title="Задачи" aria-label="Задачи"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9l2 2 4-4M8 16h8"/></svg></button>
  <button data-t="ros" title="Состав групп" aria-label="Состав групп"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg></button>
  <button data-t="log" title="Журнал" aria-label="Журнал"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h8"/></svg></button>
</nav>
<div class="mainc">
<div class="top"><div class="wrap">
  <div class="brand"><div class="logo">К20</div><div>КАИТ-20 · Посещаемость<small>Панель заведующей отделением</small></div></div>
  <div class="sp"></div>
  <div class="tabs" id="tabs" style="background:rgba(255,255,255,.12)">
    <button data-t="dash" class="on" style="color:#fff">Дашборд</button><button data-t="an" style="color:#cfe0ff">Аналитика</button><button data-t="tk" style="color:#cfe0ff">Задачи</button><button data-t="cal" style="color:#cfe0ff">Календарь дней</button><button data-t="ros" style="color:#cfe0ff">Состав групп</button><button data-t="log" style="color:#cfe0ff">Журнал</button>
  </div>
</div></div>
<div class="demo" id="demo"></div>
<main class="wrap" id="app"></main>
</div>
</div>
</div>

<div class="drawer" id="drawer"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  var K = KAIT, S = K.Store, UI = window.UI, $ = UI.$, esc = K.esc, PIN = '2026';

  /* ---------- вход ---------- */
  function enter() { $('#gate').hidden = true; $('#shell').hidden = false; init(); }
  function tryPin() {
    var v = $('#pin').value;
    if (K.REMOTE) {
      $('#pinErr').textContent = 'Проверяю…';
      K.Net.login({ pin: v }).then(function () { try { sessionStorage.setItem('kait20-admin-pin', v); } catch (e) {} enter(); }).catch(function (e) { $('#pinErr').textContent = e.message === 'auth' ? 'Неверный PIN' : 'Нет связи с сервером'; $('#pin').value = ''; });
      return;
    }
    if (v === PIN) { try { sessionStorage.setItem('kait20-admin', '1'); } catch (e) {} enter(); } else { $('#pinErr').textContent = 'Неверный PIN'; $('#pin').value = ''; } }
  $('#pinOk').onclick = tryPin; $('#pin').onkeydown = function (e) { if (e.key === 'Enter') tryPin(); };
  var ok = false, sp = '';
  if (K.REMOTE) { try { sp = sessionStorage.getItem('kait20-admin-pin') || ''; } catch (e) {} $('#gate .xs').hidden = true; $('#pin').maxLength = 40; $('#pin').inputMode = 'text'; }
  else { try { ok = sessionStorage.getItem('kait20-admin') === '1'; } catch (e) {} }
  if (K.REMOTE && sp) { K.Net.login({ pin: sp }).then(enter).catch(function () { setTimeout(function () { $('#pin').focus(); }, 50); }); }
  else if (ok) enter(); else setTimeout(function () { $('#pin').focus(); }, 50);

  /* ---------- состояние ---------- */
  var TM = K.today().slice(0, 7), TEND = K.iso(new Date(+TM.slice(0, 4), +TM.slice(5), 0));
  var st = { rg: '', tab: 'dash', from: '2026-10-01', to: TEND > '2026-11-30' ? TEND : '2026-11-30', course: 0, cs: [], spec: '', gid: '', cur: '', allMiss: false, day: null, thr: 5, allRank: false, allRisk: false, calYm: TM < '2026-10' ? '2026-11' : TM };
  var app;

  function lastWork(d) { var x = K.parse(d); for (var i = 0; i < 10 && S.isOff(K.iso(x)); i++) x.setDate(x.getDate() - 1); return K.iso(x); }
  function pct(v, d) { return v === null || v === undefined ? '–' : v.toFixed(d === undefined ? 1 : d).replace('.', ',') + '%'; }
  function fgroups() {
    return S.groups().filter(function (g) { return (!st.cs.length || st.cs.indexOf(g.course) >= 0) && (!st.spec || g.spec === st.spec) && (!st.gid || g.id === st.gid) && (!st.cur || g.curator === st.cur); });
  }
  function prevWork(d) { var x = K.parse(d); for (var i = 0; i < 14; i++) { x.setDate(x.getDate() - 1); if (!S.isOff(K.iso(x))) break; } return K.iso(x); }
  function weekRange() { var d = K.parse(lastWork(K.today())), a = new Date(d); a.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return [K.iso(a), K.iso(d)]; }
  function perOn(p) {
    var td = lastWork(K.today());
    if (p === 't') return st.from === td && st.to === td;
    if (p === 'y') { var y = prevWork(td); return st.from === y && st.to === y; }
    if (p === 'w') { var w = weekRange(); return st.from === w[0] && st.to === w[1]; }
    if (p === 'all') return st.from === '2026-10-01' && st.to === '2026-11-30';
    return st.from === p + '-01' && st.to === K.iso(new Date(+p.slice(0, 4), +p.slice(5), 0));
  }
  function monthsIn(a, b) { var out = [], d = K.parse(a); d = new Date(d.getFullYear(), d.getMonth(), 1); var e = K.parse(b); while (d <= e) { out.push(d.getFullYear() + '-' + K.pad(d.getMonth() + 1)); d.setMonth(d.getMonth() + 1); } return out.slice(0, 6); }
  function monthHead(dates) {
    var out = [], cur = null;
    dates.forEach(function (d) { var m = d.slice(0, 7); if (cur && cur.m === m) cur.n++; else { cur = { m: m, n: 1 }; out.push(cur); } });
    return out.map(function (x) { return '<th colspan="' + x.n + '" style="text-align:left;padding-left:4px;color:#475467">' + K.MONTHS[+x.m.slice(5) - 1] + '</th>'; }).join('');
  }
  function dayCounts(gs, d) {
    var c = { total: 0, here: 0, late: 0, absent: 0, skip: 0, none: 0 };
    gs.forEach(function (g) { S.rosterOn(g, d).forEach(function (s) {
      c.total++; var v = S.get(g.id, s.id, d);
      if (!v) c.none++; else if (v === '+') c.here++; else if (v === 'о') { c.here++; c.late++; } else if (v === 'и' || v === 'р') c.skip++; else c.absent++;
    }); });
    return c;
  }
  function inCollege(gs, dates) {
    var dd = st.day || lastWork(K.today()), off = S.isOff(dd), c = dayCounts(gs, dd), M = c.total || 1;
    function seg(n, col, lab) { return n ? '<div title="' + lab + ': ' + n + '" style="width:' + n / M * 100 + '%;background:' + col + '"></div>' : ''; }
    var W = 560, H = 70, n = dates.length, bw = n ? (W - 4) / n : 0, svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;margin-top:10px">';
    dates.forEach(function (d, i) {
      var x = dayCounts(gs, d), h = x.total ? (H - 8) * x.here / x.total : 0, sel = d === dd;
      svg += '<g data-dd="' + d + '" style="cursor:pointer"><title>' + K.fmtLong(d) + ': в колледже ' + x.here + ' из ' + x.total + (x.none ? ' (не отмечено ' + x.none + ')' : '') + '</title><rect x="' + (2 + i * bw) + '" y="0" width="' + Math.max(bw - 1, 1) + '" height="' + H + '" fill="transparent"/><rect x="' + (2 + i * bw + bw * .12) + '" y="' + (H - 4 - h) + '" width="' + Math.max(bw * .76, 1) + '" height="' + h + '" rx="2" fill="' + (sel ? '#2f5bea' : '#b9c6f5') + '"/></g>';
    });
    svg += '</svg>';
    return '<div class="card sec"><h3>В колледже <small>по выбранным группам · значение меняется по дням</small><span style="flex:1"></span>' +
      '<span class="noprint" style="display:inline-flex;gap:6px;align-items:center"><button class="btn ghost sm" id="dprev">‹</button><input type="date" id="dday" value="' + dd + '" style="border:1px solid var(--line);border-radius:10px;padding:6px 8px"><button class="btn ghost sm" id="dnext">›</button><button class="btn ghost sm" id="dtod">Сегодня</button></span></h3>' +
      (off ? '<div class="mut">' + K.fmtLong(dd) + ' — ' + esc(S.dayInfo(dd).label || 'выходной день') + '. Занятий нет.</div>' :
      '<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><div><div style="font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1">' + c.here + '</div><div class="mut sm">из ' + c.total + ' студентов · ' + Math.round(c.here / M * 100) + '%</div><div class="mut xs" style="margin-top:2px">' + K.fmtLong(dd) + '</div></div>' +
      '<div style="flex:1;min-width:260px"><div style="display:flex;height:16px;border-radius:6px;overflow:hidden;background:#eef1f6">' + seg(c.here, '#22a35a', 'В колледже') + seg(c.absent, '#e5483b', 'Отсутствуют') + seg(c.skip, '#98a2b3', 'ИУП / практика') + '</div>' +
      '<div class="xs mut" style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap"><span><span style="color:#22a35a">■</span> в колледже ' + c.here + (c.late ? ' (опоздали ' + c.late + ')' : '') + '</span><span><span style="color:#e5483b">■</span> отсутствуют ' + c.absent + '</span><span><span style="color:#98a2b3">■</span> ИУП / практика ' + c.skip + '</span><span>не отмечено ' + c.none + '</span></div></div></div>' + svg + '<div class="xs mut">Столбцы — число студентов в колледже по дням периода, нажмите на столбец, чтобы выбрать день.</div>') + '</div>';
  }
  function agg(gs, dates) { var c = K.emptyCnt(); gs.forEach(function (g) { K.addCnt(c, K.groupCnt(g.id, dates)); }); return c; }

  /* ---------- дашборд ---------- */
  function dash() {
    var gs = fgroups(), dates = K.studyDates(st.from, st.to), tot = agg(gs, dates), dv = K.derive(tot);
    var days = Math.round((K.parse(st.to) - K.parse(st.from)) / 864e5) + 1, pe = K.parse(st.from); pe.setDate(pe.getDate() - 1);
    var ps = K.parse(st.from); ps.setDate(ps.getDate() - days);
    var pdv = K.derive(agg(gs, K.studyDates(K.iso(ps), K.iso(pe)))), delta = pdv.counted ? dv.pct - pdv.pct : null;
    var specs = S.groups().map(function (g) { return g.spec; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    var courses = S.groups().map(function (g) { return g.course; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
    var all = S.groups();

    var h = '<div class="filters noprint"><label>С<input type="date" id="f1" value="' + st.from + '"></label><label>По<input type="date" id="f2" value="' + st.to + '"></label>' +
      '<div class="chips" style="margin-bottom:2px">' + [['t', 'Сегодня'], ['y', 'Вчера'], ['w', 'Эта неделя'], ['2026-10', 'Октябрь'], ['2026-11', 'Ноябрь'], ['all', 'Всё время']].map(function (c) { return '<button class="chip' + (perOn(c[0]) ? ' on' : '') + '" data-p="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>' +
      '<div class="chips" style="margin-bottom:2px"><span class="mut sm" style="align-self:center">Курс:</span><button class="chip' + (!st.cs.length ? ' on' : '') + '" data-c="0">Все</button>' + courses.map(function (c) { return '<button class="chip' + (st.cs.indexOf(c) >= 0 ? ' on' : '') + '" data-c="' + c + '">' + c + '</button>'; }).join('') + '</div>' +
      '<label>Специальность<select id="fs"><option value="">Все</option>' + specs.map(function (c) { return '<option' + (st.spec === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>' +
      '<label>Куратор<select id="fcu"><option value="">Все</option>' + S.curators().map(function (c) { return '<option value="' + esc(c.name) + '"' + (st.cur === c.name ? ' selected' : '') + '>' + esc(K.shortName(c.name)) + '</option>'; }).join('') + '</select></label>' +
      '<label>Группа<select id="fg"><option value="">Все</option>' + all.map(function (g) { return '<option' + (st.gid === g.id ? ' selected' : '') + '>' + g.id + '</option>'; }).join('') + '</select></label>' +
      '<div style="flex:1"></div>' + monthsIn(st.from, st.to).map(function (m) { return '<button class="btn ghost sm xlm" data-m="' + m + '">⬇ Табель · ' + K.MONTHS[+m.slice(5) - 1] + '</button>'; }).join('') + '<button class="btn ghost sm" id="pr">🖨 Печать / PDF</button></div>';

    /* кто не заполнил: по кураторам */
    function missBlock(list, day) {
      var by = {}, order = [];
      list.forEach(function (x) {
        var k = x.g.curator || '— куратор не указан';
        if (!by[k]) { by[k] = { name: k, gs: [], m: 0, n: 0 }; order.push(k); }
        var n = S.rosterOn(x.g, day).length; by[k].gs.push({ g: x.g, m: x.m, n: n }); by[k].m += x.m; by[k].n += n;
      });
      var rows = order.map(function (k) { return by[k]; }).sort(function (p, q) { return (p.m ? 1 : 0) - (q.m ? 1 : 0) || p.name.localeCompare(q.name, 'ru'); });
      st.missRows = rows; st.missDay = day;
      var none = rows.filter(function (r) { return !r.m; }).length;
      var out = '<div class="sm" style="margin:8px 0 6px"><b>Не заполнили: ' + rows.length + ' ' + (rows.length === 1 ? 'куратор' : 'кураторов') + '</b>' +
        ' <span class="mut">· красным — вообще не приступили (' + none + '), жёлтым — отмечена только часть студентов (' + (rows.length - none) + ')</span>' +
        ' <button class="btn ghost sm noprint" id="missCopy" style="margin-left:8px">📋 Скопировать напоминание</button>' +
        ' <button class="btn ghost sm noprint" id="missToggle">' + (st.missCollapsed ? '▾ Показать список' : '▴ Свернуть') + '</button></div>';
      if (st.missCollapsed) return out;
      rows.forEach(function (r) {
        var red = !r.m, bg = red ? '#fff1ef' : '#fff6dc', fg = red ? '#b0241a' : '#8a5300';
        out += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-top:1px solid var(--line)">' +
          '<span style="min-width:190px;font-weight:650;color:' + fg + '">' + esc(K.shortName(r.name)) + '</span>' +
          r.gs.map(function (x) { return '<span class="cl" data-g="' + esc(x.g.id) + '" style="cursor:pointer;background:' + (x.m ? '#fff6dc' : '#fff1ef') + ';color:' + (x.m ? '#8a5300' : '#b0241a') + ';border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600" title="' + x.m + ' из ' + x.n + ' отмечено">' + esc(x.g.id) + ' · ' + x.m + '/' + x.n + '</span>'; }).join('') + '</div>';
      });
      return out;
    }
    window.copyText = function (t) {
      function fb() { var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); UI.toast(ok ? 'Напоминание скопировано' : 'Не удалось скопировать'); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { UI.toast('Напоминание скопировано'); }, fb); else fb();
};

    /* сегодня */
    var td = lastWork(K.today()), tdOff = S.isOff(K.today()), done = 0, miss = [];
    all.forEach(function (g) { var m = S.marked(g.id, td); if (m === S.rosterOn(g, td).length) done++; else miss.push({ g: g, m: m }); });
    var frac = done / all.length, C = 2 * Math.PI * 30;
    var P = {}, part = miss.filter(function (x) { return x.m > 0; }).length, none = miss.length - part, RC = 2 * Math.PI * 78;
    P.today = '<div class="card sec today2"><div class="th"><b>' + (K.today() === td ? 'Сегодня' : 'Последний учебный день') + ', ' + K.fmtLong(td) + '</b></div>' +
      '<svg class="ring big" viewBox="0 0 190 190"><circle cx="95" cy="95" r="78" fill="none" stroke="#e8edf5" stroke-width="12"/><circle cx="95" cy="95" r="78" fill="none" stroke="#4c9bff" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (RC * frac) + ' ' + RC + '" transform="rotate(-90 95 95)"/><text x="95" y="106" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">' + Math.round(frac * 100) + '%</text><text x="95" y="128" text-anchor="middle" font-size="12" fill="#fff">групп заполнено</text></svg>' +
      '<div class="mut sm" style="text-align:center">' + (tdOff ? 'Сегодня выходной (' + esc(S.dayInfo(K.today()).label) + '). ' : '') + 'Полностью заполнено групп: ' + done + ' из ' + all.length + '</div>' +
      '<div class="trio3"><div><b>' + done + '</b><span>готово</span></div><div><b style="color:#ffd27a">' + part + '</b><span>частично</span></div><div><b style="color:#ff9a8f">' + none + '</b><span>не начали</span></div></div></div>';
    P.miss = '<div class="card sec misscard">' + (miss.length ? missBlock(miss, td) : '<div class="mut sm">✓ Все группы отмечены</div>') + '</div>';

    /* KPI */
    var risk = riskList(gs, dates);
    P.col = inCollege(gs, dates);
    P.kpi = '<div class="kpis">' +
      '<div class="kpi main"><div class="l">Посещаемость</div><div class="v">' + pct(dv.pct) + '</div><div class="d">' + (delta === null ? dates.length + ' уч. дней в периоде' : (delta >= 0 ? '▲ +' : '▼ ') + pct(delta).replace('%', ' п.п.') + ' к пред. периоду') + '</div></div>' +
      '<div class="kpi"><div class="l">Пропусков всего</div><div class="v">' + dv.absent + '</div><div class="d">уважительных ' + dv.excused + ' · неуваж. ' + dv.unexc + '</div></div>' +
      '<div class="kpi"><div class="l">Неуважительных</div><div class="v" style="color:var(--nev)">' + dv.unexc + '</div><div class="d">' + (dv.absent ? Math.round(dv.unexc / dv.absent * 100) : 0) + '% от всех пропусков</div></div>' +
      '<div class="kpi"><div class="l">Опозданий</div><div class="v" style="color:var(--late)">' + dv.late + '</div><div class="d">' + (dv.counted ? pct(dv.late / dv.counted * 100) : '–') + ' от посещений</div></div>' +
      '<div class="kpi"><div class="l">Студентов в зоне риска</div><div class="v">' + risk.filter(function (r) { return r.unexc >= st.thr; }).length + '</div><div class="d">от ' + st.thr + ' неуваж. пропусков</div></div>' +
      '</div>';

    /* тепловая карта */
    P.hm = '<div class="card sec"><h3>Карта посещаемости <small>доля отсутствующих по группам и дням · нажмите на группу</small></h3><div class="hm"><table class="hm"><thead><tr><th></th>' + monthHead(dates) + '<th></th></tr><tr><th></th>' +
      dates.map(function (d) { return '<th title="' + K.fmtLong(d) + '">' + K.parse(d).getDate() + '</th>'; }).join('') + '<th>%</th></tr></thead><tbody>' +
      gs.map(function (g) {
        var gv = K.derive(K.groupCnt(g.id, dates));
        return '<tr><td class="g" data-g="' + esc(g.id) + '" title="' + esc(g.curator || '') + '">' + esc(g.id) + '</td>' + dates.map(function (d) {
          var c = K.studentCnt, n = 0, a = 0, cn = 0;

    if (!ks.length) return '<div class="mut sm">Пока нет. По умолчанию: сб и вс выходные (кроме суббот, где в данных есть занятия), 4 ноября — праздник.</div>';
    return '<table class="tb"><tbody>' + ks.map(function (d) { return '<tr><td>' + K.fmtLong(d) + '</td><td><span class="pill ' + (o[d].t === 'off' ? 'amb' : 'gr') + '">' + (o[d].t === 'off' ? 'выходной' : 'учебный') + '</span></td><td class="mut">' + esc(o[d].l || '') + '</td><td><button class="btn ghost sm" data-rm="' + d + '">Убрать</button></td></tr>'; }).join('') + '</tbody></table>';
  }


  /* ---------- состав групп ---------- */
  function fmtD(d) { return d ? K.fmtShort(d) : ''; }
  function dayBefore(d) { var x = K.parse(d); x.setDate(x.getDate() - 1); return K.iso(x); }
  function roster() {
    var gs = S.groups(); if (!st.rg || !S.group(st.rg)) st.rg = gs[0] ? gs[0].id : '';
    var g = S.group(st.rg), t = K.today();
    var h = '<div class="hero"><h1>Состав групп</h1><p>Добавляйте новых студентов, отмечайте выбывших, переводите между группами и меняйте куратора. История отметок сохраняется.</p></div><div class="card sec">';
    h += '<div class="filters" style="margin:0 0 12px"><label>Группа<select id="rg">' + gs.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === st.rg ? ' selected' : '') + '>' + esc(x.name) + ' · ' + x.course + ' курс</option>'; }).join('') + '</select></label></div>';
    if (!g) { app.innerHTML = h + '<div class="empty">Групп нет.</div></div>'; return; }
    var act = g.all.filter(function (s) { return !s.left || s.left >= t; }), gone = g.all.filter(function (s) { return s.left && s.left < t; });
    h += '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><div><span class="mut sm">Куратор:</span> <b>' + (g.curator ? esc(g.curator) : '— не назначен —') + '</b></div><button class="btn ghost sm" id="rcur">Сменить куратора</button>' + (K.REMOTE && g.curator ? '<button class="btn ghost sm" id="rlink">Ссылка куратора</button>' : '') + '</div>';
    h += '<h3>Студенты <small>' + act.length + '</small></h3><table class="tb"><tbody>' + act.map(function (s, i) {
      return '<tr><td class="mut" style="width:30px">' + (i + 1) + '</td><td>' + esc(s.fio) + (s.from ? ' <span class="mut xs">с ' + fmtD(s.from) + '</span>' : '') + (s.left ? ' <span class="pill amb">выбывает ' + fmtD(s.left) + '</span>' : '') + '</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-a="ren" data-s="' + s.id + '">Изменить</button> <button class="btn ghost sm" data-a="mv" data-s="' + s.id + '">Перевести</button> <button class="btn ghost sm" data-a="out" data-s="' + s.id + '">Выбыл</button></td></tr>';
    }).join('') + '</tbody></table>';
    h += '<div style="margin-top:12px"><button class="btn" id="radd">+ Добавить студента</button></div>';
    if (gone.length) h += '<h3 style="margin-top:20px">Выбывшие <small>' + gone.length + '</small></h3><table class="tb"><tbody>' + gone.map(function (s) { return '<tr><td>' + esc(s.fio) + '</td><td class="mut">до ' + fmtD(s.left) + '</td><td style="text-align:right"><button class="btn ghost sm" data-a="back" data-s="' + s.id + '">Вернуть</button></td></tr>'; }).join('') + '</tbody></table>';
    h += '</div>';
    if (K.REMOTE) h += '<div class="card sec"><h3>Личные ссылки кураторов</h3><div class="mut sm">Каждый куратор открывает журнал только по своей ссылке — пароль не нужен. Ссылку видите только вы.</div><div style="margin-top:10px"><button class="btn ghost sm" id="rlinks">Показать все ссылки</button></div><div id="llist"></div></div>';
    app.innerHTML = h;
    $('#rg').onchange = function (e) { st.rg = e.target.value; roster(); };
    function done(p, msg) { return p.then(function () { UI.toast(msg); roster(); }).catch(function (e) { UI.toast('Ошибка: ' + e.message); }); }
    $('#radd').onclick = function () {
      UI.form('Новый студент в ' + g.name, [{ id: 'fio', label: 'ФИО', req: true, hint: 'Фамилия Имя Отчество полностью' }, { id: 'from', label: 'Дата зачисления в группу', type: 'date', value: t, req: true, hint: 'Отметки до этой даты не требуются' }], 'Добавить').then(function (v) { if (v) done(S.addStudent(g.id, v.fio, v.from), 'Студент добавлен'); });
    };
    $('#rcur').onclick = function () {
      var names = S.curators().map(function (c) { return c.name; });
      UI.form('Куратор группы ' + g.name, [{ id: 'sel', label: 'Выбрать из текущих кураторов', type: 'select', value: g.curator, options: [['', '— новый (впишите ниже) —']].concat(names.map(function (n) { return [n, n]; })) }, { id: 'new', label: 'Или впишите ФИО нового куратора', hint: 'Например: Иванова Мария Петровна' }], 'Сохранить').then(function (v) {
        if (!v) return; var n = v.new || v.sel; if (!n) return; done(S.setCurator(g.id, n), 'Куратор изменён');
      });
    };
    var lk = $('#rlink'); if (lk) lk.onclick = function () { showLinks(g.curator); };
    var rl = $('#rlinks'); if (rl) rl.onclick = function () { showLinks(); };
    [].forEach.call(app.querySelectorAll('[data-a]'), function (b) {
      b.onclick = function () {
        var sid = b.dataset.s, o = S.student(sid).s, a = b.dataset.a;
        if (a === 'ren') UI.form('Изменить ФИО', [{ id: 'fio', label: 'ФИО', value: o.fio, req: true }], 'Сохранить').then(function (v) { if (v) done(S.renameStudent(sid, v.fio), 'Сохранено'); });
        else if (a === 'out') UI.form('Студент выбыл: ' + K.shortName(o.fio), [{ id: 'd', label: 'Последний день обучения в группе', type: 'date', value: t, req: true, hint: 'После этой даты студент не попадёт в списки отметок. История сохранится.' }], 'Отметить выбытие').then(function (v) { if (v) done(S.removeStudent(sid, v.d), 'Студент выбыл'); });
        else if (a === 'mv') UI.form('Перевести: ' + K.shortName(o.fio), [{ id: 'g', label: 'В какую группу', type: 'select', value: '', options: S.groups().filter(function (x) { return x.id !== g.id; }).map(function (x) { return [x.id, x.name + ' · ' + x.course + ' курс']; }) }, { id: 'd', label: 'С какой даты в новой группе', type: 'date', value: t, req: true }], 'Перевести').then(function (v) { if (v && v.g) done(S.moveStudent(sid, v.g, v.d), 'Переведён в ' + v.g); });
        else if (a === 'back') done(S.restoreStudent(sid), 'Студент возвращён');
      };
    });
  }
  function showLinks(only) {
    var base = new URL('index.html', location.href).href;
    K.Net.tokens().then(function (tk) {
      var rows = tk.filter(function (x) { return !only || x[0] === only; });
      if (only && rows.length) return UI.copyBox('Ссылка куратора ' + only, base + '?k=' + rows[0][1], 'Отправьте её куратору. Пароль не нужен, ссылка личная.');
      var txt = rows.map(function (x) { return x[0] + ' — ' + base + '?k=' + x[1]; }).join('\n');
      UI.copyBox('Ссылки всех кураторов', txt, 'Скопируйте и разошлите каждому куратору только его ссылку.');
    }).catch(function () { UI.toast('Не удалось получить ссылки'); });
  }

  /* ---------- кураторские задачи ---------- */
  function taskState(t) { if (t.done) return 'done'; if (t.due && t.due < K.today()) return 'late'; if (t.due === K.today()) return 'today'; return 'open'; }
  var TSL = { open: ['в работе', 'gr'], today: ['срок сегодня', 'amb'], late: ['просрочена', 'red'], done: ['выполнена', 'gr'] };
  function taskForm(t) {
    return new Promise(function (res) {
      var cur = S.curators().map(function (c) { return c.name; }), ov = document.createElement('div'); ov.className = 'ov on'; ov.style.zIndex = 90; ov.style.alignItems = 'center';
      var fs = 'width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:4px;font:inherit';
      ov.innerHTML = '<div class="modal" style="max-height:92vh;overflow:auto"><h3>' + (t ? 'Изменить задачу' : 'Новая задача по кураторству') + '</h3>' +
        '<label class="sm mut" style="display:block;margin-top:10px">Что нужно сделать<input data-f="title" type="text" value="' + esc(t ? t.title : '') + '" style="' + fs + '" autocomplete="off" placeholder="Например: сдать социальные паспорта групп"></label>' +
        '<label class="sm mut" style="display:block;margin-top:10px">Подробности (необязательно)<textarea data-f="desc" rows="3" style="' + fs + '">' + esc(t ? t.desc : '') + '</textarea></label>' +
        '<label class="sm mut" style="display:block;margin-top:10px">Срок<input data-f="due" type="date" value="' + esc(t ? t.due : '') + '" style="' + fs + '"></label>' +
        (t ? '<div class="sm mut" style="margin-top:10px">Куратор: <b style="color:#fff">' + esc(t.cur) + '</b></div>' :
        '<div class="sm mut" style="margin-top:12px">Кому <button class="btn ghost sm" id="tkAll" style="margin-left:8px">Выбрать всех</button> <button class="btn ghost sm" id="tkNone">Снять</button></div>' +
        '<div id="tkList" style="max-height:200px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:11px;padding:6px 10px">' + cur.map(function (n, i) { return '<label style="display:flex;gap:8px;align-items:center;padding:4px 0"><input type="checkbox" data-n="' + i + '"> ' + esc(n) + '</label>'; }).join('') + '</div>') +
        '<div class="acts" style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" data-r="0" style="flex:1">Отмена</button><button class="btn" data-r="1" style="flex:1">' + (t ? 'Сохранить' : 'Поставить задачу') + '</button></div></div>';
      function q(f) { return ov.querySelector('[data-f="' + f + '"]'); }
      function setAll(v) { [].forEach.call(ov.querySelectorAll('[data-n]'), function (c) { c.checked = v; }); }
      ov.addEventListener('click', function (e) {
        if (e.target.id === 'tkAll') return setAll(true); if (e.target.id === 'tkNone') return setAll(false);
        var b = e.target.closest('[data-r]');
        if (!b && e.target === ov) { ov.remove(); return res(null); }
        if (!b) return;
        if (b.dataset.r === '0') { ov.remove(); return res(null); }
        var title = q('title').value.trim(); if (!title) { q('title').style.borderColor = '#d33'; return; }
        var who = t ? [t.cur] : [].filter.call(ov.querySelectorAll('[data-n]'), function (c) { return c.checked; }).map(function (c) { return cur[+c.dataset.n]; });
        if (!who.length) { UI.toast('Выберите хотя бы одного куратора'); return; }
        ov.remove(); res({ title: title, desc: q('desc').value.trim(), due: q('due').value, who: who });
      });
      document.body.appendChild(ov); q('title').focus();
    });
  }
  function tasks() {
    var all = S.tasks().slice(), f = st.tf || 'all', fc = st.tcur || '';
    var cnt = { open: 0, today: 0, late: 0, done: 0 }; all.forEach(function (t) { cnt[taskState(t)]++; });
    var list = all.filter(function (t) { var k = taskState(t); return (!fc || t.cur === fc) && (f === 'all' || (f === 'open' ? (k === 'open' || k === 'today') : k === f)); });
    list.sort(function (a, b) { var da = a.done ? 1 : 0, db = b.done ? 1 : 0; return da - db || (a.due || '9').localeCompare(b.due || '9') || a.cur.localeCompare(b.cur, 'ru'); });
    var curs = []; all.forEach(function (t) { if (curs.indexOf(t.cur) < 0) curs.push(t.cur); }); curs.sort(function (a, b) { return a.localeCompare(b, 'ru'); });
    var h = '<div class="hero"><h1>Кураторские задачи</h1><p>Поставьте задачу одному, нескольким или всем кураторам: она появится у них на странице журнала со сроком и кнопкой «Выполнено».</p></div>' +
      '<div class="kpis"><div class="kpi"><div class="l">В работе</div><div class="v">' + (cnt.open + cnt.today) + '</div></div><div class="kpi"><div class="l">Просрочено</div><div class="v" style="color:var(--nev)">' + cnt.late + '</div></div><div class="kpi"><div class="l">Выполнено</div><div class="v">' + cnt.done + '</div></div></div>' +
      '<div class="card sec"><div class="filters" style="margin:0 0 10px"><button class="btn" id="tkNew">+ Новая задача</button><div class="chips">' + [['all', 'Все'], ['open', 'В работе'], ['late', 'Просроченные'], ['done', 'Выполненные']].map(function (c) { return '<button class="chip' + (f === c[0] ? ' on' : '') + '" data-tf="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>' +
      '<label>Куратор<select id="tkCur"><option value="">Все</option>' + curs.map(function (n) { return '<option value="' + esc(n) + '"' + (n === fc ? ' selected' : '') + '>' + esc(K.shortName(n)) + '</option>'; }).join('') + '</select></label></div>';
    if (!list.length) h += '<div class="empty">' + (all.length ? 'По выбранному фильтру задач нет.' : 'Задач пока нет. Нажмите «+ Новая задача».') + '</div>';
    else h += '<table class="tb"><thead><tr><th>Куратор</th><th>Задача</th><th>Срок</th><th>Статус</th><th></th></tr></thead><tbody>' + list.map(function (t) {
      var k = taskState(t), sl = TSL[k];
      return '<tr><td style="white-space:nowrap">' + esc(K.shortName(t.cur)) + '</td><td><b>' + esc(t.title) + '</b>' + (t.desc ? '<div class="mut sm">' + esc(t.desc) + '</div>' : '') + '</td><td style="white-space:nowrap">' + (t.due ? K.fmtShort(t.due) : '—') + '</td><td><span class="pill ' + sl[1] + '">' + sl[0] + '</span>' + (t.done ? '<div class="xs mut">' + K.fmtShort(t.done) + '</div>' : '') + '</td>' +
        '<td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-ta="done" data-id="' + t.id + '">' + (t.done ? 'Вернуть' : '✓ Выполнено') + '</button> <button class="btn ghost sm" data-ta="edit" data-id="' + t.id + '">Изменить</button> <button class="btn ghost sm" data-ta="del" data-id="' + t.id + '">Удалить</button></td></tr>';
    }).join('') + '</tbody></table>';
    app.innerHTML = h + '</div>';
    function fail(e) { UI.toast('Ошибка: ' + e.message); }
    $('#tkNew').onclick = function () { taskForm(null).then(function (v) { if (v) S.addTask(v.who, v.title, v.desc, v.due).then(function () { UI.toast('Задача поставлена: ' + v.who.length); tasks(); }).catch(fail); }); };
    $('#tkCur').onchange = function (e) { st.tcur = e.target.value; tasks(); };
    [].forEach.call(app.querySelectorAll('[data-tf]'), function (b) { b.onclick = function () { st.tf = b.dataset.tf; tasks(); }; });
    [].forEach.call(app.querySelectorAll('[data-ta]'), function (b) { b.onclick = function () {
      var id = b.dataset.id, t = S.tasks().filter(function (x) { return x.id === id; })[0]; if (!t) return;
      if (b.dataset.ta === 'done') S.doneTask(id, !t.done).then(function () { tasks(); }).catch(fail);
      else if (b.dataset.ta === 'edit') taskForm(t).then(function (v) { if (v) S.editTask(id, v.title, v.desc, v.due).then(function () { UI.toast('Сохранено'); tasks(); }).catch(fail); });
      else UI.ask('Удалить задачу «' + t.title + '» у куратора ' + K.shortName(t.cur) + '?', 'Удалить').then(function (ok) { if (ok) S.delTask(id).then(function () { UI.toast('Удалено'); tasks(); }).catch(fail); });
    }; });
  }

  /* ---------- журнал ---------- */
  function log() {
    var j = S.journal().slice(0, 150), h = '<div class="hero"><h1>Журнал изменений</h1><p>Кто и когда менял отметки и календарь. Последние 150 записей.</p></div><div class="card sec">';
    if (!j.length) h += '<div class="empty">Пока изменений нет. Откройте страницу куратора и отметьте любую группу — запись появится здесь.</div>';
    else h += '<table class="tb"><thead><tr><th>Когда</th><th>Кто</th><th>Что изменено</th></tr></thead><tbody>' + j.map(function (e) {
      var t = new Date(e.t), when = K.pad(t.getDate()) + '.' + K.pad(t.getMonth() + 1) + ' ' + K.pad(t.getHours()) + ':' + K.pad(t.getMinutes()), what;
      if (e.note) what = '✏ ' + esc(e.note) + (e.sid && S.student(e.sid) ? '' : '');
      else if (e.day) what = '🗓 ' + K.fmtShort(e.day) + ': ' + (e.dayType === 'off' ? 'выходной' : e.dayType === 'work' ? 'учебный день' : 'по умолчанию') + (e.label ? ' · ' + esc(e.label) : '');
      else { var x = S.student(e.sid); what = esc(x ? K.shortName(x.s.fio) : e.sid) + ' <span class="mut">(' + esc(e.gid || (x ? x.g.id : '')) + ')</span> · ' + K.fmtShort(e.date) + ': ' + UI.st(e.prev || '', e.prev === '+' ? '✓' : e.prev) + ' → ' + UI.st(e.code || '', e.code === '+' ? '✓' : e.code); }
      return '<tr><td class="mut" style="white-space:nowrap">' + when + '</td><td>' + esc(e.who) + '</td><td>' + what + '</td></tr>';
    }).join('') + '</tbody></table>';
    app.innerHTML = h + '</div>';
  }

  function render() {
    [].forEach.call(document.querySelectorAll('#tabs button, .rail button'), function (b) { b.classList.toggle('on', b.dataset.t === st.tab); b.style.color = b.dataset.t === st.tab ? '' : '#cfe0ff'; });
    if (st.tab === 'dash' || st.tab === 'an') dash(); else if (st.tab === 'tk') tasks(); else if (st.tab === 'cal') { cal(); bindRm(); } else if (st.tab === 'ros') roster(); else log();
  }
  function bindRm() { [].forEach.call(app.querySelectorAll('[data-rm]'), function (b) { b.onclick = function () { S.setDay(b.dataset.rm, null); }; }); }
  function init() {
    app = $('#app'); UI.demoBar($('#demo'), 'Данные: октябрь 2026 (2–4 курсы) и ноябрь 2026 (1 курс), ФИО студентов обезличены. Страница куратора открывается отдельно: <a href="index.html" target="_blank">index.html</a> — отметки оттуда сразу появляются здесь.');
    [].forEach.call(document.querySelectorAll('#tabs button, .rail button'), function (b) { b.onclick = function () { st.tab = b.dataset.t; $('#drawer').classList.remove('on'); render(); window.scrollTo(0, 0); }; });
    S.onChange(function () { var sc = window.scrollY; render(); window.scrollTo(0, sc); });
    render();
  }
})();
</script>
</body>
</html>
