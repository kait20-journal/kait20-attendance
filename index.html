<title>КАИТ-20 · Посещаемость — куратор</title>
<script>(function(){var t="";try{t=localStorage.getItem("kait.theme")||""}catch(e){}if(t!=="light"&&t!=="dark")t="dark";document.documentElement.setAttribute("data-theme",t)})()</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand"><div class="logo">К20</div><div>КАИТ-20<span class="hl"> · Посещаемость</span><small>Журнал куратора</small></div></div>
  <div class="sp"></div>
  <button class="who" id="themeBtn" title="Светлая / тёмная тема" aria-label="Светлая или тёмная тема" style="margin-right:6px"></button>
  <button class="who" id="helpBtn" title="Как пользоваться" aria-label="Как пользоваться" style="margin-right:6px">?<span class="hl"> Помощь</span></button>
  <button class="who" id="whoBtn">Представьтесь</button>
</div></div>
<div class="demo" id="demo"></div>

<main class="wrap" id="app"></main>
<nav class="bnav" id="bnav" aria-label="Разделы"><button data-n="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Группы</span></button><button data-n="day"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>День</span></button><button data-n="month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4M9 10v11M15 10v11"/></svg><span>Табель</span></button><button data-n="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Ещё</span></button></nav>

<div class="ov" id="nameOv"><div class="modal">
  <h3>Как вас зовут?</h3>
  <div class="mut sm" style="margin-top:6px">Выберите себя из списка кураторов: имя попадёт в журнал изменений, так видно, кто поставил отметку. Пароль не нужен.</div>
  <select id="nameSel" style="width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:10px 0;background:#fff"></select>
  <input type="text" id="nameIn" placeholder="Фамилия И. О." autocomplete="name" style="display:none">
  <button class="btn" id="nameOk" style="width:100%">Продолжить</button>
</div></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="anim.js"></script>
<script>
(function () {
  var K = KAIT, S = K.Store, UI = window.UI, $ = UI.$, esc = K.esc;
  var app = $('#app');
  var st = { gid: null, date: null, view: 'day', course: 0, ym: null, mine: false };

  function lastWork(d) { var x = K.parse(d); for (var i = 0; i < 10 && S.isOff(K.iso(x)); i++) x.setDate(x.getDate() - 1); return K.iso(x); }
  st.date = lastWork(K.today()); st.ym = st.date.slice(0, 7);

  function hashRead() {
    var h = location.hash.replace('#', ''), o = {};
    h.split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) o[kv[0]] = decodeURIComponent(kv[1] || ''); });
    st.gid = o.g && S.group(o.g) ? o.g : null;
    if (o.d && /^\d{4}-\d\d-\d\d$/.test(o.d)) { st.date = o.d; st.ym = o.d.slice(0, 7); }
    if (o.v === 'month' || o.v === 'day') st.view = o.v;
  }
  function hashWrite() {
    var h = st.gid ? 'g=' + encodeURIComponent(st.gid) + '&d=' + st.date + '&v=' + st.view : '';
    try { if (location.hash.replace('#', '') !== h) history.replaceState(null, '', '#' + h); } catch (e) {}
  }

  /* ---------- имя ---------- */
  function who() { var w = S.who(); $('#whoBtn').textContent = w ? '👤 ' + K.shortName(w) : 'Представьтесь'; return w; }
  function myGroups() { if (K.REMOTE) return S.groups().map(function (g) { return g.id; }); var w = S.who(), c = S.curators().filter(function (x) { return x.name === w; })[0]; return c ? c.groups : []; }
  function helpModal() {
    var ov = document.createElement('div'); ov.className = 'ov on'; ov.style.alignItems = 'center'; ov.style.zIndex = 90;
    ov.innerHTML = '<div class="modal" style="max-height:92vh;overflow:auto"><h3>Как пользоваться журналом</h3><ol style="margin:10px 0 0;padding-left:20px;line-height:1.5;font-size:14px">' +
      '<li><b>Откройте свою группу</b> на главной (вкладка «Мои группы»).</li>' +
      '<li><b>Отметьте день.</b> Зелёная ✓ рядом со студентом — присутствует. Нажмите на статус, чтобы выбрать причину отсутствия: н — неуважительная, б — больничный, з — заявление, п — по приказу, о — опоздание, и — ИУП, р — практика.</li>' +
      '<li><b>Быстрее:</b> кнопка «✓ Все присутствуют», затем поправьте тех, кого нет.</li>' +
      '<li><b>Другой день</b> — полоска с числами над списком. «Табель за месяц» — вся таблица: нажмите на клетку, чтобы изменить отметку.</li>' +
      '<li><b>Ошиблись?</b> Кнопка «↩ Отменить» возвращает предыдущую отметку.</li>' +
      '<li><b>Выходные и дистанционное обучение</b> проставляет Заведующий отделением в календаре; в выходные отметки закрыты.</li>' +
      '<li><b>Задачи и мероприятия</b> от Заведующего отделением — на главной странице. Сделали — нажмите «Выполнено».</li>' +
      '</ol><div class="mut sm" style="margin-top:10px">Всё сохраняется автоматически. Ваша ссылка личная — не пересылайте её другим.</div><button class="btn" id="helpOk" style="width:100%;margin-top:14px">Понятно</button></div>';
    document.body.appendChild(ov); ov.querySelector('#helpOk').onclick = function () { ov.remove(); };
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    try { localStorage.setItem('kait.help.seen', '1'); } catch (e) {}
  }
  function askName(force) {
    if (S.who() && !force) return;
    var sel = $('#nameSel'), cur = S.who();
    sel.innerHTML = '<option value="">— выберите себя —</option>' + S.curators().map(function (c) { return '<option value="' + esc(c.name) + '"' + (c.name === cur ? ' selected' : '') + '>' + esc(c.name) + ' · ' + c.groups.join(', ') + '</option>'; }).join('') + '<option value="__other">Меня нет в списке…</option>';
    $('#nameIn').style.display = 'none';
    $('#nameOv').classList.add('on');
  }
  $('#nameSel').onchange = function () { var o = this.value === '__other'; $('#nameIn').style.display = o ? 'block' : 'none'; if (o) $('#nameIn').focus(); };
  $('#nameOk').onclick = function () {
    var v = $('#nameSel').value === '__other' ? $('#nameIn').value.trim() : $('#nameSel').value; if (!v) return;
    S.who(v); st.mine = myGroups().length > 0; st.course = 0; $('#nameOv').classList.remove('on'); who(); render();
  };
  $('#nameIn').onkeydown = function (e) { if (e.key === 'Enter') $('#nameOk').click(); };
  $('#whoBtn').onclick = function () { askName(true); };
  $('#helpBtn').onclick = helpModal;
  UI.themeBtn($('#themeBtn'));

  /* ---------- кураторские задачи ---------- */
  function myTasks() { var w = S.who(); return S.tasks().filter(function (t) { return K.REMOTE || t.cur === w; }); }
  function tasksBlock() {
    var all = myTasks(), open = all.filter(function (t) { return !t.done; }), done = all.filter(function (t) { return t.done; }), td = K.today();
    if (!all.length) return '';
    open.sort(function (a, b) { return (a.due || '9').localeCompare(b.due || '9'); });
    var h = '<div class="card sec" style="margin:14px 0"><h3>Кураторские задачи <small>' + (open.length ? 'в работе: ' + open.length : 'всё выполнено') + '</small></h3>';
    open.forEach(function (t) {
      var late = t.due && t.due < td, today = t.due === td;
      h += '<div class="tkrow" style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)"><div style="flex:1"><b>' + esc(t.title) + '</b>' + (t.desc ? '<div class="mut sm">' + esc(t.desc) + '</div>' : '') +
        (t.due ? '<div class="xs" style="margin-top:3px;color:' + (late ? 'var(--t-bad)' : today ? 'var(--t-warn)' : 'inherit') + '">' + (late ? 'Просрочено · ' : today ? 'Срок сегодня · ' : 'Срок: ') + K.fmtShort(t.due) + '</div>' : '') + '</div><button class="btn sm" data-tdone="' + t.id + '">✓ Выполнено</button></div>';
    });
    if (done.length) h += '<div style="margin-top:8px"><button class="btn ghost sm" id="tkShow">' + (st.showDone ? 'Скрыть выполненные' : 'Выполненные (' + done.length + ')') + '</button></div>' + (st.showDone ? done.map(function (t) { return '<div class="mut sm" style="padding:6px 0;border-top:1px solid var(--line)">✓ ' + esc(t.title) + ' · ' + K.fmtShort(t.done) + ' <button class="btn ghost sm" data-tback="' + t.id + '" style="margin-left:6px">Вернуть</button></div>'; }).join('') : '');
    return h + '</div>';
  }
  function modeCard(di) {
    if (!di.mode) return '';
    var el = di.mode === 'elearn';
    return '<div class="card" style="margin:10px 0;background:' + (el ? 'rgba(255,210,122,.2)' : 'rgba(110,190,255,.22)') + '"><b>' + (el ? '📚 Электронное обучение' : '💻 Дистанционное обучение') + '</b> <span class="mut">— ' + (el ? 'студенты выполняют задания дома, пар нет.' : 'студенты подключаются к парам из дома.') + '</span></div>';
  }
  function eventsBlock() {
    var td = K.today(), list = S.eventsFor(S.who()).filter(function (e) { return e.date >= td; }).sort(function (a, b) { return a.date.localeCompare(b.date); }).slice(0, 6);
    if (!list.length) return '';
    return '<div class="card sec" style="margin:14px 0"><h3>Кураторские мероприятия <small>ближайшие</small></h3>' + list.map(function (e) {
      return '<div style="padding:9px 0;border-top:1px solid var(--line)"><b>' + esc(e.title) + '</b> <span class="mut">· ' + K.fmtLong(e.date) + '</span>' + (e.desc ? '<div class="mut sm">' + esc(e.desc) + '</div>' : '') + (e.courses && e.courses.length ? '<div class="xs mut">Курсы: ' + e.courses.join(', ') + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function bindTasks() {
    function fail(e) { UI.toast('Не удалось сохранить: ' + e.message); }
    [].forEach.call(app.querySelectorAll('[data-tdone]'), function (b) { b.onclick = function () { S.doneTask(b.dataset.tdone, true).then(function () { UI.toast('Задача выполнена'); }).catch(fail); }; });
    [].forEach.call(app.querySelectorAll('[data-tback]'), function (b) { b.onclick = function () { S.doneTask(b.dataset.tback, false).catch(fail); }; });
    var sh = document.getElementById('tkShow'); if (sh) sh.onclick = function () { st.showDone = !st.showDone; render(); };
  }

  /* ---------- главный экран ---------- */
  function home() {
    var di = S.dayInfo(st.date), mine = myGroups(); if (!mine.length) st.mine = false;
    var groups = S.groups().filter(function (g) { return st.mine ? mine.indexOf(g.id) >= 0 : (!st.course || g.course === st.course); });
    var courses = [0].concat(S.groups().map(function (g) { return g.course; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort());
    var h = '<div class="hero"><h1>Отметьте посещаемость</h1><p>Выберите группу. Отметки сохраняются сразу и видны Заведующему отделением.</p></div>' +
      '<div class="mrow"><span class="sm mut">Дата:</span><input type="date" id="dsel" value="' + st.date + '" style="border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff">' +
      '<button class="btn ghost sm" id="dyest">Вчера</button><button class="btn ghost sm" id="dtoday">Сегодня</button><button class="btn ghost sm" id="dtomo">Завтра</button></div>';
    if (di.off) h += '<div class="card" style="margin:10px 0;opacity:.85"><b>🗓 ' + K.fmtLong(st.date) + ' — ' + esc(di.label || 'выходной день') + '.</b> <span class="mut">Отметки закрыты. Выберите учебный день.</span></div>';
    h += modeCard(di) + tasksBlock() + eventsBlock();
    h += '<div class="chips" style="margin-top:12px">' + (mine.length ? '<button class="chip' + (st.mine ? ' on' : '') + '" data-c="m">Мои группы (' + mine.length + ')</button>' : '') + courses.map(function (c) { return '<button class="chip' + (!st.mine && st.course === c ? ' on' : '') + '" data-c="' + c + '">' + (c ? c + ' курс' : 'Все группы') + '</button>'; }).join('') + '</div>';
    h += '<div class="grid">' + groups.map(function (g) {
      var n = S.rosterOn(g, st.date).length, m = di.off ? 0 : S.marked(g.id, st.date), done = m === n, pct = n ? Math.round(m / n * 100) : 0;
      return '<button class="gcard" data-g="' + esc(g.id) + '"><b>' + esc(g.name) + '</b><div class="meta">' + g.course + ' курс · ' + n + ' студ.</div>' + (!st.mine && g.curator ? '<div class="meta">' + esc(K.shortName(g.curator)) + '</div>' : '') +
        '<div class="bar ' + (done ? 'done' : '') + '"><i style="width:' + pct + '%"></i></div>' +
        '<div class="state ' + (done ? 'ok' : '') + '">' + (di.off ? 'Выходной' : done ? '✓ Отмечено полностью' : m ? 'Отмечено ' + m + ' из ' + n : 'Не отмечено') + '</div></button>';
    }).join('') + '</div>';
    app.innerHTML = h;
    bindTasks();
    $('#dsel').onchange = function (e) { if (e.target.value) { st.date = e.target.value; st.ym = st.date.slice(0, 7); render(); } };
    $('#dyest').onclick = function () { var d = K.parse(K.today()); d.setDate(d.getDate() - 1); st.date = lastWork(K.iso(d)); st.ym = st.date.slice(0, 7); render(); };
    $('#dtomo').onclick = function () { var d = K.parse(K.today()); d.setDate(d.getDate() + 1); for (var i = 0; i < 10 && S.isOff(K.iso(d)); i++) d.setDate(d.getDate() + 1); st.date = K.iso(d); st.ym = st.date.slice(0, 7); render(); };
    $('#dtoday').onclick = function () { st.date = lastWork(K.today()); st.ym = st.date.slice(0, 7); render(); };
    [].forEach.call(app.querySelectorAll('.chip'), function (b) { b.onclick = function () { if (b.dataset.c === 'm') { st.mine = true; st.course = 0; } else { st.mine = false; st.course = +b.dataset.c; } render(); }; });
    [].forEach.call(app.querySelectorAll('.gcard'), function (b) { b.onclick = function () { st.gid = b.dataset.g; render(); window.scrollTo(0, 0); }; });
  }

  /* ---------- группа ---------- */
  function monthShift(n) { var p = st.ym.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1); st.ym = d.getFullYear() + '-' + K.pad(d.getMonth() + 1); }
  function group() {
    var g = S.group(st.gid), p = st.ym.split('-'), y = +p[0], m = +p[1] - 1, dates = K.monthDates(y, m, false);
    var h = '<div class="crumb"><button class="back" id="back">← Все группы</button><h2>' + esc(g.name) + '</h2><span class="mut sm">' + g.course + ' курс · ' + g.students.length + ' студ.' + (g.curator ? ' · куратор ' + esc(K.shortName(g.curator)) : '') + '</span><div class="sp" style="flex:1"></div>' +
      '<div class="tabs"><button data-v="day" class="' + (st.view === 'day' ? 'on' : '') + '">День</button><button data-v="month" class="' + (st.view === 'month' ? 'on' : '') + '">Табель за месяц</button></div></div>';
    h += '<div class="mrow"><button class="btn ghost sm" id="mp">‹</button><b style="min-width:130px;text-align:center">' + K.MONTHS[m] + ' ' + y + '</b><button class="btn ghost sm" id="mn">›</button><span style="flex:1"></span><button class="btn ghost sm" id="rost" style="margin-right:6px">👥 Состав группы</button><button class="btn ghost sm" id="undo"' + (S.canUndo() ? '' : ' disabled') + '>↩ Отменить</button></div>';
    if (st.view === 'day') {
      h += '<div class="datebar" id="dbar">' + dates.map(function (d) {
        var dt = K.parse(d), di = S.dayInfo(d), mk = di.off ? 0 : S.marked(g.id, d), cls = 'dpill' + (d === st.date ? ' on' : '') + (di.off ? ' wk' : '') + (!di.off && mk === S.rosterOn(g, d).length ? ' done' : !di.off && mk ? ' part' : '');
        return '<button class="' + cls + '" data-d="' + d + '" title="' + esc(di.label) + '"><small>' + K.DOW[dt.getDay()] + '</small><b>' + dt.getDate() + '</b></button>';
      }).join('') + '</div>';
      var di = S.dayInfo(st.date), cnt = { p: 0, a: 0, n: 0 };
      S.rosterOn(g, st.date).forEach(function (s) { var v = S.get(g.id, s.id, st.date); if (!v) cnt.n++; else if (v === '+' || v === 'о') cnt.p++; else cnt.a++; });
      var rosN = S.rosterOn(g, st.date).length, full = !di.off && rosN > 0 && cnt.n === 0;
      h += '<div class="sumbar"><div class="dnav"><button class="btn ghost sm" id="dprev" aria-label="Предыдущий учебный день">‹</button><div class="n">' + K.fmtLong(st.date) + '</div><button class="btn ghost sm" id="dnext" aria-label="Следующий учебный день">›</button></div>' +
        (di.off ? '' : '<div><span>присутствуют</span><div class="n" style="color:var(--plus)">' + cnt.p + '</div></div><div><span>отсутствуют</span><div class="n" style="color:var(--nev)">' + cnt.a + '</div></div><div><span>не отмечено</span><div class="n">' + cnt.n + '</div></div>' +
        (full ? '<span class="daydone">✓ День заполнен</span>' : '<button class="btn sm" id="allp"' + (cnt.n ? '' : ' disabled') + '>✓ ' + (cnt.n < rosN ? 'Остальные присутствуют' : 'Все присутствуют') + '</button>')) + '</div>';
      if (di.mode) h += modeCard(di);
      if (di.off) h += '<div class="card" style="margin-bottom:12px;opacity:.85"><b>🗓 ' + esc(di.label || 'Выходной день') + '</b> <span class="mut">— отметки закрыты Заведующим отделением.</span></div>';
      h += '<div class="list">' + S.rosterOn(g, st.date).map(function (s, i) {
        var v = S.get(g.id, s.id, st.date), c = v ? K.CODES[v] : null;
        return '<div class="row" data-s="' + s.id + '"><span class="num">' + (i + 1) + '</span><div class="nm">' + esc(s.fio) + '</div>' +
          (!v && !di.off ? '<button class="ok" title="Присутствует" data-ok="' + s.id + '">✓</button>' : '') +
          '<button class="cur ' + (c ? 'k-' + c.key : 'k-none') + '" data-pick="' + s.id + '"' + (di.off ? ' disabled' : '') + '>' + (c ? '<span class="st">' + (v === '+' ? '✓' : v) + '</span><span class="lb">' + c.label + '</span>' : '<span class="lg">Не отмечен</span><span class="shrt">Нет…</span>') + '</button></div>';
      }).join('') + '</div>' + UI.legend() + '<div class="xs mut swhint">Проведите по списку влево или вправо, чтобы перейти к соседнему учебному дню.</div>';
      if (!di.off && rosN) h += full ? '<div class="dayfix ok"><div><b>✓ День заполнен</b><span>в колледже ' + cnt.p + ' · нет ' + cnt.a + '</span></div><button class="btn ghost" id="dnext2">Следующий день ›</button></div>'
        : '<div class="dayfix"><div><b>Осталось отметить: ' + cnt.n + '</b><span>из ' + rosN + ' студентов</span></div><button class="btn" id="allp2">✓ ' + (cnt.n < rosN ? 'Остальные здесь' : 'Все здесь') + '</button></div>';
    } else {
      h += '<div class="mut sm" style="margin:2px 0 10px">Нажмите на клетку, чтобы поставить или изменить отметку. Штриховка — выходной день.</div><div id="mx"></div>' + UI.legend();
    }
    app.innerHTML = h;
    $('#back').onclick = function () { st.gid = null; render(); };
    $('#mp').onclick = function () { monthShift(-1); render(); }; $('#mn').onclick = function () { monthShift(1); render(); };
    $('#rost').onclick = function () { rosterEditor(g.id); };
    $('#undo').onclick = function () { var n = S.undoLast(); UI.toast(n > 1 ? 'Отменена пачка отметок: ' + n : n ? 'Отменён один шаг' : 'Нечего отменять'); };
    [].forEach.call(app.querySelectorAll('.tabs button'), function (b) { b.onclick = function () { st.view = b.dataset.v; render(); }; });
    if (st.view === 'day') {
      var bar = $('#dbar'), on = bar.querySelector('.on'); if (on) bar.scrollLeft = on.offsetLeft - 90;
      [].forEach.call(bar.querySelectorAll('.dpill'), function (b) { b.onclick = function () { st.date = b.dataset.d; render(); }; });
      var allF = function () {
        var w = who() || '—', n = 0; (S.batch || function (f) { f(); })(function () { S.rosterOn(g, st.date).forEach(function (s) { if (!S.get(g.id, s.id, st.date)) { S.set(g.id, s.id, st.date, '+', w, true); n++; } }); });
        S.commit(); UI.toast('Отмечено присутствующими: ' + n);
      };
      var all = $('#allp'), all2 = $('#allp2'), dn2 = $('#dnext2'); if (all) all.onclick = allF; if (all2) all2.onclick = allF; if (dn2) dn2.onclick = function () { stepDay(1); };
      $('#dprev').onclick = function () { stepDay(-1); }; $('#dnext').onclick = function () { stepDay(1); };
      [].forEach.call(app.querySelectorAll('[data-ok]'), function (b) { b.onclick = function (e) { e.stopPropagation(); S.set(g.id, b.dataset.ok, st.date, '+', who()); }; });
      [].forEach.call(app.querySelectorAll('[data-pick]'), function (b) { b.onclick = function () { UI.openSheet({ gid: g.id, sid: b.dataset.pick, date: st.date }); }; });
      [].forEach.call(app.querySelectorAll('.row .nm'), function (n) { n.onclick = function () { UI.openSheet({ gid: g.id, sid: n.parentNode.dataset.s, date: st.date }); }; });
    } else UI.matrix($('#mx'), g.id, dates, { editable: true });
  }


  /* состав группы: куратор сам добавляет, переименовывает, отмечает выбывших и возвращает студентов */
  function rosterEditor(gid) {
    var ov = document.createElement('div'); ov.className = 'ov on'; ov.style.zIndex = 80; ov.style.alignItems = 'center';
    function fmt(d) { return d ? K.fmtShort(d) : ''; }
    function draw() {
      var g = S.group(gid), t = K.today();
      var act = g.all.filter(function (s) { return !s.left || s.left >= t; }), gone = g.all.filter(function (s) { return s.left && s.left < t; });
      var h = '<div class="modal" style="max-height:90vh;overflow:auto"><h3 style="margin:0 0 4px">Состав группы ' + esc(g.name) + '</h3><div class="xs mut" style="margin-bottom:10px">Выбывший студент остаётся в истории отметок. Ошиблись — верните его.</div><div id="rerr" class="sm" style="color:#e5484d"></div>';
      h += '<div class="list">' + act.map(function (s, i) {
        return '<div class="row" style="gap:6px"><span class="num">' + (i + 1) + '</span><div class="nm" style="flex:1;cursor:default">' + esc(s.fio) + (s.left ? ' <span class="xs mut">выбывает ' + fmt(s.left) + '</span>' : '') + '</div><button class="btn ghost sm" data-a="ren" data-s="' + s.id + '">Изменить</button><button class="btn ghost sm" data-a="out" data-s="' + s.id + '">Выбыл</button></div>';
      }).join('') + '</div>';
      h += '<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" data-a="add" style="flex:1">＋ Добавить студента</button><button class="btn ghost" data-a="close">Закрыть</button></div>';
      if (gone.length) h += '<h4 style="margin:16px 0 6px">Выбывшие</h4><div class="list">' + gone.map(function (s) { return '<div class="row" style="gap:6px"><div class="nm mut" style="flex:1;cursor:default">' + esc(s.fio) + ' <span class="xs">до ' + fmt(s.left) + '</span></div><button class="btn ghost sm" data-a="back" data-s="' + s.id + '">Вернуть</button></div>'; }).join('') + '</div>';
      ov.innerHTML = h + '</div>';
    }
    function run(p, msg) {
      return p.then(function () { UI.toast(msg); draw(); render(); }).catch(function (e) {
        var m = e.message === 'forbidden' ? 'Сервер ещё не разрешил кураторам менять состав' : e.message;
        var el = ov.querySelector('#rerr'); if (el) el.textContent = 'Не получилось: ' + m;
      });
    }
    ov.addEventListener('click', function (e) {
      if (e.target === ov) { ov.remove(); return; }
      var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a, g = S.group(gid), t = K.today();
      var sid = b.dataset.s, stu = null; g.all.forEach(function (x) { if (x.id === sid) stu = x; });
      if (a === 'close') ov.remove();
      else if (a === 'add') UI.form('Новый студент в ' + g.name, [{ id: 'fio', label: 'ФИО', req: true, hint: 'Фамилия Имя Отчество полностью' }, { id: 'from', label: 'С какого дня в группе', type: 'date', value: t, req: true, hint: 'За более ранние дни отметки не требуются' }], 'Добавить').then(function (v) { if (v) run(S.addStudent(gid, v.fio, v.from), 'Студент добавлен'); });
      else if (a === 'ren' && stu) UI.form('ФИО студента', [{ id: 'fio', label: 'ФИО', value: stu.fio, req: true }], 'Сохранить').then(function (v) { if (v && v.fio !== stu.fio) run(S.renameStudent(sid, v.fio), 'ФИО изменено'); });
      else if (a === 'out' && stu) UI.form('Выбыл: ' + K.shortName(stu.fio), [{ id: 'left', label: 'Последний день в группе', type: 'date', value: t, req: true, hint: 'Начиная со следующего дня в списке его не будет. Прошлые отметки сохранятся.' }], 'Отметить выбывшим').then(function (v) { if (v) run(S.removeStudent(sid, v.left), 'Студент выбыл'); });
      else if (a === 'back' && stu) run(S.restoreStudent(sid), 'Студент возвращён');
    });
    ov.addEventListener('keydown', function (e) { if (e.key === 'Escape') ov.remove(); });
    draw(); document.body.appendChild(ov);
  }

  function stepDay(dir) {
    var d = K.parse(st.date); for (var i = 0; i < 21; i++) { d.setDate(d.getDate() + dir); if (!S.isOff(K.iso(d))) break; }
    st.date = K.iso(d); st.ym = st.date.slice(0, 7); app.setAttribute('data-slide', dir > 0 ? 'l' : 'r'); render(); setTimeout(function () { app.removeAttribute('data-slide'); }, 320);
  }
  (function () {
    var x0 = null, y0 = 0, skip = false;
    app.addEventListener('touchstart', function (e) { var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; skip = !st.gid || st.view !== 'day' || !!(e.target.closest && e.target.closest('.datebar,.mwrap,input,select')); }, { passive: true });
    app.addEventListener('touchend', function (e) {
      if (x0 === null || skip) { x0 = null; return; } var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2.2) stepDay(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();
  function navGo(n) {
    if (n === 'more') return moreSheet();
    if (n === 'home') { st.gid = null; render(); window.scrollTo(0, 0); return; }
    var mine = myGroups(), gid = st.gid || (st.lastGid && S.group(st.lastGid) ? st.lastGid : '') || mine[0];
    if (!gid) { UI.toast('Сначала выберите группу'); return; }
    st.gid = gid; st.view = n; render(); window.scrollTo(0, 0);
  }
  [].forEach.call(document.querySelectorAll('#bnav button'), function (b) { b.onclick = function () { navGo(b.dataset.n); }; });
  function moreSheet() {
    var ov = document.createElement('div'); ov.className = 'ov on'; ov.style.zIndex = 90;
    ov.innerHTML = '<div class="sheet"><h3>Ещё</h3><div class="morel">' +
      '<button data-m="help"><b>? Как пользоваться</b><span>Короткая инструкция</span></button>' +
      '<button data-m="theme"><b>' + (UI.theme() === 'light' ? '🌙 Тёмная тема' : '☀️ Светлая тема') + '</b><span>Сейчас: ' + (UI.theme() === 'light' ? 'светлая' : 'тёмная') + '</span></button>' +
      '<button data-m="inst"><b>📲 Значок на экран телефона</b><span>Журнал будет открываться как приложение</span></button>' +
      (K.REMOTE ? '' : '<button data-m="who"><b>👤 Сменить куратора</b><span>Только в демо-версии</span></button>') +
      '</div><button class="btn ghost" data-m="x" style="width:100%;margin-top:12px">Закрыть</button></div>';
    ov.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]'); if (!b && e.target !== ov) return; ov.remove(); if (!b) return;
      if (b.dataset.m === 'help') helpModal(); else if (b.dataset.m === 'theme') $('#themeBtn').click(); else if (b.dataset.m === 'inst') installHelp(); else if (b.dataset.m === 'who') askName(true);
    });
    document.body.appendChild(ov);
  }
  function installHelp() {
    var tok = ''; try { tok = sessionStorage.getItem('kait20-k') || ''; } catch (e) {}
    /* значок должен запомнить личную ссылку, поэтому на время установки возвращаем её в адрес */
    if (tok) { try { history.replaceState(null, '', location.pathname + '?k=' + encodeURIComponent(tok)); } catch (e) {} }
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var ov = document.createElement('div'); ov.className = 'ov on'; ov.style.alignItems = 'center'; ov.style.zIndex = 90;
    ov.innerHTML = '<div class="modal" style="max-height:92vh;overflow:auto"><h3>Значок на экран телефона</h3><ol style="margin:10px 0 0;padding-left:20px;line-height:1.55;font-size:14px">' +
      (ios ? '<li>Откройте журнал в <b>Safari</b> (не внутри мессенджера).</li><li>Нажмите кнопку <b>«Поделиться»</b> внизу экрана.</li><li>Выберите <b>«На экран „Домой“»</b> и нажмите «Добавить».</li>'
           : '<li>Откройте журнал в <b>Chrome</b> или Яндекс Браузере (не внутри мессенджера).</li><li>Нажмите меню <b>⋮</b> в углу экрана.</li><li>Выберите <b>«Добавить на главный экран»</b> или «Установить приложение».</li>') +
      '<li>Дальше открывайте журнал с этого значка — ссылка больше не понадобится.</li></ol>' +
      '<div class="mut sm" style="margin-top:10px">Делайте это, не закрывая это окно. Значок запоминает вашу личную ссылку, поэтому ставьте его только на свой телефон.</div><button class="btn" id="instOk" style="width:100%;margin-top:14px">Готово</button></div>';
    function close() { ov.remove(); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
    document.body.appendChild(ov); ov.querySelector('#instOk').onclick = close; ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
  }
  function navState() { if (st.gid) st.lastGid = st.gid; var cur = st.gid ? st.view : 'home'; [].forEach.call(document.querySelectorAll('#bnav button'), function (b) { b.classList.toggle('on', b.dataset.n === cur); }); document.body.classList.toggle('ingroup', !!st.gid && st.view === 'day'); }
  function render() { who(); hashWrite(); if (st.gid) group(); else home(); navState(); }
  var raf; S.onChange(function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(function () { var sc = window.scrollY, mx = document.querySelector('.mwrap'), mt = mx && mx.scrollTop, ml = mx && mx.scrollLeft; render(); window.scrollTo(0, sc); var m2 = document.querySelector('.mwrap'); if (m2 && mx) { m2.scrollTop = mt; m2.scrollLeft = ml; } }); });
  window.addEventListener('hashchange', function () { hashRead(); render(); });

  UI.demoBar($('#demo'));
  function boot() { document.body.classList.add('ready'); hashRead(); render(); if (!K.REMOTE) askName(false); else { try { if (!localStorage.getItem('kait.help.seen')) setTimeout(helpModal, 700); } catch (e) {} } }
  if (!K.REMOTE) boot();
  else {
    var tok = ''; try { tok = new URLSearchParams(location.search).get('k') || sessionStorage.getItem('kait20-k') || ''; } catch (e) {}
    if (!tok) { app.innerHTML = '<div class="card" style="padding:22px;margin-top:20px"><h3>Нужна личная ссылка</h3><div class="mut" style="margin-top:6px">Откройте журнал по личной ссылке, которую вам выдал Заведующий отделением. Пароль не нужен.</div></div>'; }
    else {
      try { sessionStorage.setItem('kait20-k', tok); history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
      app.innerHTML = '<div class="mut" style="padding:30px;text-align:center">Загружаю журнал…</div>';
      K.Net.login({ k: tok }).then(function () { $('#whoBtn').onclick = null; st.mine = false; boot(); }).catch(function (e) {
        try { sessionStorage.removeItem('kait20-k'); } catch (x) {}
        app.innerHTML = '<div class="card" style="padding:22px;margin-top:20px"><h3>Не удалось открыть журнал</h3><div class="mut" style="margin-top:6px">' + (e.message === 'auth' ? 'Ссылка недействительна. Попросите Заведующего отделением выдать новую.' : 'Нет связи с сервером. Обновите страницу.') + '</div></div>';
      });
    }
  }
})();
</script>
</body>
